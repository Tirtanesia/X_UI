name: Build c1s ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c1s]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
          OTA_KEY_PK8: ${{ secrets.OTA_KEY_PK8 }}
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            attr bc ccache clang ffmpeg fuse3 libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget

          # EROFS extraction uses the project's userspace fuse.erofs tool.
          # These modules are optional on hosted runners; do not make apt depend
          # on a version-specific linux-modules-extra package unavailable there.
          sudo modprobe fuse || echo "::warning::FUSE kernel module could not be loaded; EROFS extraction may fail."
          sudo modprobe f2fs || echo "::warning::F2FS kernel module could not be loaded; F2FS firmware extraction may fail."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for secret_name in PLATFORM_KEY_PK8 PLATFORM_KEY_PEM OTA_KEY_PK8 OTA_KEY_PEM; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done

          printf '%s' "$PLATFORM_KEY_PK8" | base64 --decode > security/artisanrom_platform.pk8
          printf '%s' "$PLATFORM_KEY_PEM" | base64 --decode > security/artisanrom_platform.x509.pem
          printf '%s' "$OTA_KEY_PK8" | base64 --decode > security/artisanrom_ota.pk8
          printf '%s' "$OTA_KEY_PEM" | base64 --decode > security/artisanrom_ota.x509.pem

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build dependencies
        run: |
          chmod +x scripts/internal/gen_config_file.sh
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download source firmware (S26+ donor)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-target

      - name: Extract source firmware (S26+ donor)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-target

      - name: Download target firmware (c1s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --force --ignore-source

      - name: Extract target firmware (c1s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Install Missing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y golang pcre2-utils

      - name: Build ROM
        run: |
          chmod +x scripts/internal/build_odin_package.sh
          chmod +x scripts/apktool.sh
          chmod +x scripts/utils/module_utils.sh
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload c1s ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xui-c1s
          path: |
            out/*.tar*
            out/*.zip*

      - name: Upload c1s ROM to Pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          shopt -s nullglob
          rom_files=(out/*.zip)
          if (( ${#rom_files[@]} == 0 )); then
            echo "::error::No ROM ZIP found in out/."
            exit 1
          fi

          if [[ -z "$PIXELDRAIN_API_KEY" ]]; then
            echo "::notice::PIXELDRAIN_API_KEY is not configured; the GitHub artifact is still available. Skipping Pixeldrain upload."
            exit 0
          fi

          ROM_FILE="${rom_files[0]}"
          echo "Uploading ${ROM_FILE} to Pixeldrain..."
          curl --fail-with-body --silent --show-error --retry 3 \
            -u ":$PIXELDRAIN_API_KEY" \
            -F "file=@$ROM_FILE" \
            https://pixeldrain.com/api/file
