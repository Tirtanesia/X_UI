name: Build Arktik

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c1s]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up build environment
        run: |
         sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget curl
            
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg

          sudo modprobe erofs f2fs

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/monsterrom_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/monsterrom_platform.x509.pem

      - name: Process Source & Target Firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          
          echo "Downloading and extracting source firmware..."
          ./scripts/download_fw.sh --force --ignore-target
          ./scripts/extract_fw.sh --force --ignore-target
          
          echo "Downloading and extracting target firmware..."
          ./scripts/download_fw.sh --force --ignore-source
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Build ROM
        run: |
          chmod +x scripts/internal/build_odin_package.sh
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arktik-${{ matrix.target }}
          path: |
            out/*.tar*
            out/*.zip*
